# La configuration du projet Supabase de Glisil (CLI et déploiement).
#
# Les deux portes de TOTEM n'ont PAS de jeton Supabase : le boîtier signe
# chacun de ses appels avec sa propre clé (HMAC, trois en-têtes x-totem-*),
# et c'est la porte (supabase/functions/_shared/porte.ts) qui vérifie. Sans
# ces deux lignes, la passerelle refuserait la requête AVANT la porte, faute
# d'en-tête Authorization — et le robot ne verrait qu'un « 401 » muet.

# L'identifiant LOCAL du projet : celui de la BÊTA. Pour la production, toujours
#   supabase functions deploy … --project-ref dfixghiwqlwulmzixlpf
# (docs/PRODUCTION.md) — sans --project-ref, le déploiement partirait sur la bêta.
project_id = "erngzpklfslbfznioxxr"

[functions.totem-sms]
verify_jwt = false

[functions.totem-commandes]
verify_jwt = false

# Le veilleur de chaîne : réveillé chaque minute par pg_cron (0006), il se
# garde lui-même par un jeton (x-veilleur-jeton, rangé dans le coffre et dans
# les secrets de la fonction) — pas par un jeton de session Supabase.
[functions.veilleur]
verify_jwt = false

# Les e-mails de Glisil (code avant sortie, verrou) : réveillée par la base
# (pg_net, pg_cron), gardée par son propre jeton (x-courriel-jeton, rangé dans
# le coffre et dans les secrets de la fonction).
[functions.courriel]
verify_jwt = false

# L'entrée (0035) : adresse e-mail et mot de passe, puis le code de
# l'application d'authentification. L'adresse se confirme par un code à six
# chiffres, valable 10 minutes ; le mot de passe oublié et le changement de mot
# de passe ont aussi leur code. Les modèles ne montrent que le code. Sur le
# projet en ligne, ces réglages se recopient dans le tableau de bord
# (Authentication → Emails et → Providers → Email) — voir docs/CONNEXION.md.
# La règle des mots de passe, la même qu'en production (tableau de bord → Sign In / Providers → Email,
# décision du 30/10) et que l'écran (app/src/noyau/motDePasse.ts, admin/src/noyau/entree.ts).
[auth]
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 600

# Une langue par e-mail : celle des métadonnées d'Auth (« langue », 0037), l'anglais sinon.
[auth.email.template.confirmation]
subject = "{{ if eq (printf \"%v\" .Data.langue) \"fr\" }}Votre code Glisil : {{ .Token }}{{ else }}Your Glisil code: {{ .Token }}{{ end }}"
content_path = "./supabase/templates/code-par-email.html"

[auth.email.template.magic_link]
subject = "{{ if eq (printf \"%v\" .Data.langue) \"fr\" }}Votre code Glisil : {{ .Token }}{{ else }}Your Glisil code: {{ .Token }}{{ end }}"
content_path = "./supabase/templates/code-par-email.html"

[auth.email.template.recovery]
subject = "{{ if eq (printf \"%v\" .Data.langue) \"fr\" }}Glisil · changer votre mot de passe{{ else }}Glisil · reset your password{{ end }}"
content_path = "./supabase/templates/reinitialisation.html"

[auth.email.template.reauthentication]
subject = "{{ if eq (printf \"%v\" .Data.langue) \"fr\" }}Glisil · confirmer le changement de mot de passe{{ else }}Glisil · confirm your password change{{ end }}"
content_path = "./supabase/templates/reauthentification.html"
